<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px;

  .card { max-width: 380px; width: 100%; text-align: center; background: #fff;
    border: 1px solid #cfd6dc; border-radius: 20px; padding: 28px 24px 24px;

    border-radius: 14px; padding: 12px; border: 1px solid #e8ecef; }
  .qr img { width: 100%; height: 100%; display: block; }
  .url { display: inline-block; font-family: ui-monospace, Consolas, monospace;
    font-size: 13px; font-weight: 600; color: #0d7d99; background: #d3edf4;
    padding: 8px 12px; border-radius: 8px; word-break: break-all; text-decoration: none; }
  .steps { text-align: left; font-size: 12.5px; line-height: 1.6; color: #46545f;
    margin-top: 18px; padding-top: 16px; border-top: 1px solid #e8ecef; }
